[project]
name = "telegram-bot-aiogram-template"
version = "0.1.0"
description = "Telegram bot template built with Python and aiogram 3"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Zver1o7", url = "https://github.com/Zver1o7" }]
dependencies = [
  "aiogram>=3.7,<4.0",
  "python-dotenv>=1.0,<2.0",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
